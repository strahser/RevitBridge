name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: C# Core tests (TUnit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run TUnit
        run: >
          dotnet run
          --project tests/RevitBridge.Core.Tests/RevitBridge.Core.Tests.csproj
          -c Release

  python-tests:
    name: MCP server tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install --upgrade pip websocket-client
      - name: Run unittest
        run: >
          python -X utf8 -m unittest discover
          -s mcp-server/tests -p "test_*.py" -v
